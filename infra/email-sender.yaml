AWSTemplateFormatVersion: "2010-09-09"
Description: Shared Stand SES sender identity; deploy once in us-east-1, not per environment

Parameters:
  EmailIdentityName:
    Type: String
    Default: playstand.app
    Description: Domain owned by Stand whose DNS records the operator can manage

  BimiLogoUrl:
    Type: String
    Default: https://playstand.app/bimi/logo-stand.svg
    AllowedPattern: '^$|^https://[^\s;"]+$'
    Description: Optional public HTTPS URL of a BIMI SVG Tiny PS logo

  BimiCertificateUrl:
    Type: String
    Default: ""
    AllowedPattern: '^$|^https://[^\s;"]+$'
    Description: Optional public HTTPS URL of the BIMI VMC or CMC PEM certificate

Rules:
  BimiCertificateRequiresLogo:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref BimiCertificateUrl, ""]
          - !Not [!Equals [!Ref BimiLogoUrl, ""]]
        AssertDescription: Supply BimiLogoUrl when BimiCertificateUrl is set

Conditions:
  HasBimiLogo: !Not [!Equals [!Ref BimiLogoUrl, ""]]
  HasBimiCertificate: !Not [!Equals [!Ref BimiCertificateUrl, ""]]

Resources:
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailIdentity: !Ref EmailIdentityName
      DkimAttributes:
        SigningEnabled: true
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      FeedbackAttributes:
        EmailForwardingEnabled: true

Outputs:
  BimiRecordName:
    Condition: HasBimiLogo
    Description: Publish this TXT record at the domain DNS provider
    Value: !Sub "default._bimi.${EmailIdentityName}"
  BimiRecordValue:
    Condition: HasBimiLogo
    Description: BIMI TXT record value; DNS is not modified by this stack
    Value: !If
      - HasBimiCertificate
      - !Sub "v=BIMI1; l=${BimiLogoUrl}; a=${BimiCertificateUrl}"
      - !Sub "v=BIMI1; l=${BimiLogoUrl}; a="
  EmailIdentityName:
    Value: !Ref EmailIdentity
  EmailIdentityArn:
    Value: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailIdentityName}"
  DkimDNSTokenName1:
    Value: !GetAtt EmailIdentity.DkimDNSTokenName1
  DkimDNSTokenValue1:
    Value: !GetAtt EmailIdentity.DkimDNSTokenValue1
  DkimDNSTokenName2:
    Value: !GetAtt EmailIdentity.DkimDNSTokenName2
  DkimDNSTokenValue2:
    Value: !GetAtt EmailIdentity.DkimDNSTokenValue2
  DkimDNSTokenName3:
    Value: !GetAtt EmailIdentity.DkimDNSTokenName3
  DkimDNSTokenValue3:
    Value: !GetAtt EmailIdentity.DkimDNSTokenValue3
