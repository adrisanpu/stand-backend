  StandProdInfocardsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: stand-${Environment}-infocards-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName:
          Fn::Sub: stand-${Environment}-infocards-policy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
          - Sid: DynamoDB
            Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            Resource:
            - Fn::Sub:
              - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
              - TableName:
                  Ref: StandProdGameTable
          - Sid: S3InfocardsUploads
            Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            Resource:
              Fn::Sub: arn:aws:s3:::stand-${Environment}-infocards-uploads-${AWS::AccountId}/*
          - Sid: S3InfocardsPresign
            Effect: Allow
            Action:
            - s3:GetObject
            Resource:
              Fn::Sub: arn:aws:s3:::stand-${Environment}-infocards-uploads-${AWS::AccountId}/*
          - Sid: BedrockInvoke
            Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
              Fn::Sub: arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-lite-v1:0
          - Sid: LambdaInvokeQuizGenerate
            Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
              Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:stand-${Environment}-quiz-fn-generate
    Metadata:
      SamResourceId: StandProdInfocardsRole
  StandProdInfocardsFnGet:
