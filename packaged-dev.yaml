AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: STAND Backend - Fully Managed Infrastructure
Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
    - prod
    - dev
    Description: Deployment environment (prod or dev)
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_54eXBuNq1
    Description: Cognito User Pool ID for JWT authorizer
  CognitoAppClientId:
    Type: String
    Default: 52ekpup21eo5ic4caokn2a33k3
    Description: Cognito App Client ID (JWT audience)
  StripeSuccessUrl:
    Type: String
    Default: https://playstand.app/home
    Description: Stripe checkout success redirect URL
  StripeCancelUrl:
    Type: String
    Default: https://playstand.app/home
    Description: Stripe checkout cancel redirect URL
  StripeLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:781283585341:layer:stripe-layer:5
    Description: ARN of the Stripe Lambda layer (created manually in AWS)
  PlayerTokenSecret:
    Type: String
    MinLength: 32
    NoEcho: true
    Description: Required private HMAC secret (at least 32 characters) for participant
      sessions
  KivlyExternalWritesEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
    Description: Allow Kivly customer creation and reward assignment
  EmailSenderAddress:
    Type: String
    Default: no-reply@playstand.app
    Description: Verified SES From address for participant verification and reward
      emails
  StackRewardEmailEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
    Description: Enable STACK reward email after SES setup and authorized Kivly QR
      acceptance
  EmailIdentityName:
    Type: String
    Default: playstand.app
    Description: Existing shared SES domain identity in us-east-1 (managed outside
      this stack)
Globals:
  Function:
    Runtime: python3.13
    Architectures:
    - x86_64
    Timeout: 30
    MemorySize: 128
    Tracing: PassThrough
    Environment:
      Variables:
        STAGE:
          Ref: Environment
        GAMES_TABLE:
          Ref: StandProdGameTable
        USERS_TABLE:
          Ref: StandProdUserTable
        GAMEPLAYER_TABLE:
          Ref: StandProdGameplayerTable
        CATALOG_TABLE:
          Ref: StandProdCatalogTable
        STRIPE_SECRET_NAME:
          Fn::Sub: stand/${Environment}/stripe
        PLAYER_TOKEN_SECRET:
          Ref: PlayerTokenSecret
        STACK_PRIZES_TABLE:
          Ref: StandStackPrizesTable
        KIVLY_EXTERNAL_WRITES_ENABLED:
          Ref: KivlyExternalWritesEnabled
        STACK_REWARD_EMAIL_ENABLED:
          Ref: StackRewardEmailEnabled
Resources:
  StandStackPrizesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: stand-${Environment}-stack-prizes
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
      - AttributeName: gameId
        AttributeType: S
      - AttributeName: id
        AttributeType: S
      - AttributeName: work
        AttributeType: S
      - AttributeName: dueAt
        AttributeType: N
      KeySchema:
      - AttributeName: gameId
        KeyType: HASH
      - AttributeName: id
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: pending-work
        KeySchema:
        - AttributeName: work
          KeyType: HASH
        - AttributeName: dueAt
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
    Metadata:
      SamResourceId: StandStackPrizesTable
  StandStackPrizeDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
    Metadata:
      SamResourceId: StandStackPrizeDeadLetterQueue
  StandStackPrizeQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      VisibilityTimeout: 360
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - StandStackPrizeDeadLetterQueue
          - Arn
        maxReceiveCount: 5
    Metadata:
      SamResourceId: StandStackPrizeQueue
  StandStackPrizeDelivery:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: stand-${Environment}-stack-prize-delivery
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-ikdosstmajg3/stand-backend-dev/28ea35ff8f75d431c02763eb06aea232
      Handler: lambda_function.lambda_handler
      Timeout: 60
      MemorySize: 256
      Layers:
      - Ref: StandCommonLayer
      Environment:
        Variables:
          STACK_PRIZES_QUEUE:
            Ref: StandStackPrizeQueue
          EMAIL_SENDER_ADDRESS:
            Ref: EmailSenderAddress
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: StandStackPrizesTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: StandProdGameTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: StandProdGameplayerTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: StandProdUserTable
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - StandStackPrizeQueue
            - QueueName
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/kivly/*
        - Effect: Allow
          Action: ses:SendRawEmail
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ses:us-east-1:${AWS::AccountId}:identity/${EmailIdentityName}
          Condition:
            StringEquals:
              ses:FromAddress:
                Ref: EmailSenderAddress
      Events:
        RecoverOutbox:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
        Deliver:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - StandStackPrizeQueue
              - Arn
            BatchSize: 1
            FunctionResponseTypes:
            - ReportBatchItemFailures
    Metadata:
      SamResourceId: StandStackPrizeDelivery
  StandProdGameRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: stand-${Environment}-game-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Ref: StandProdGameRolePolicy
      Policies:
      - PolicyName: KivlyOwnerCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:CreateSecret
            - secretsmanager:DeleteSecret
            - secretsmanager:GetSecretValue
            Resource:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/kivly/*
    Metadata:
      SamResourceId: StandProdGameRole
  StandProdGameRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: stand-${Environment}-game-role-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: CloudWatchLogs
          Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
            Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
        - Sid: DynamoDB
          Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:BatchGetItem
          - dynamodb:BatchWriteItem
          - dynamodb:TransactWriteItems
          - dynamodb:ConditionCheckItem
          Resource:
          - Fn::Sub:
            - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
            - TableName:
                Ref: StandProdGameTable
          - Fn::Sub:
            - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/gsi-ownerUserId
            - TableName:
                Ref: StandProdGameTable
          - Fn::Sub:
            - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/gsi-gameName
            - TableName:
                Ref: StandProdGameTable
          - Fn::Sub:
            - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
            - TableName:
                Ref: StandProdUserTable
          - Fn::Sub:
            - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
            - TableName:
                Ref: StandProdGameplayerTable
          - Fn::Sub:
            - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/gsi-raffleEligible
            - TableName:
                Ref: StandProdGameplayerTable
          - Fn::Sub:
            - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
            - TableName:
                Ref: StandProdCatalogTable
          - Fn::GetAtt:
            - StandEmailVerificationTable
            - Arn
          - Fn::GetAtt:
            - StandStackPrizesTable
            - Arn
          - Fn::Sub: ${StandStackPrizesTable.Arn}/index/pending-work
        - Sid: StackPrizeEnqueue
          Effect: Allow
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - StandStackPrizeQueue
            - Arn
        - Sid: LambdaInvoke
          Effect: Allow
          Action: lambda:InvokeFunction
          Resource:
            Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:stand-${Environment}-*
        - Sid: S3Presign
          Effect: Allow
          Action:
          - s3:GetObject
          Resource:
            Fn::Sub:
            - arn:aws:s3:::${BucketName}/*
            - BucketName:
                Ref: StandProdEmpareja2CharBucket
        - Sid: SSMParameters
          Effect: Allow
          Action:
          - ssm:GetParameter
          - ssm:GetParameters
          Resource:
            Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/stand/${Environment}/config/*
        - Sid: S3ClientLogos
          Effect: Allow
          Action:
          - s3:GetObject
          Resource:
            Fn::Sub: ${UserMediaBucket.Arn}/users/*/logos/*
        - Sid: S3GamePrizeImages
          Effect: Allow
          Action:
          - s3:GetObject
          - s3:PutObject
          Resource:
            Fn::Sub: ${UserMediaBucket.Arn}/games/*
        - Sid: S3ParticipantPhotosRead
          Effect: Allow
          Action:
          - s3:GetObject
          Resource:
            Fn::Sub: ${UserMediaBucket.Arn}/players/*
        - Sid: S3StagedPrizeImageTags
          Effect: Allow
          Action:
          - s3:PutObjectTagging
          - s3:DeleteObjectTagging
          Resource:
            Fn::Sub: ${UserMediaBucket.Arn}/games/staged/*
    Metadata:
      SamResourceId: StandProdGameRolePolicy
  StandPublicRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: stand-${Environment}-public-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Ref: StandProdGameRolePolicy
      Policies:
      - PolicyName: KivlyCompletionRewards
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            Resource:
              Fn::GetAtt:
              - StandKivlyRegistrationTable
              - Arn
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/kivly/*
      - PolicyName: EmailVerification
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: VerificationRecords
            Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:ConditionCheckItem
            Resource:
              Fn::GetAtt:
              - StandEmailVerificationTable
              - Arn
          - Sid: SendVerificationEmail
            Effect: Allow
            Action: ses:SendEmail
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ses:us-east-1:${AWS::AccountId}:identity/${EmailIdentityName}
            Condition:
              StringEquals:
                ses:FromAddress:
                  Ref: EmailSenderAddress
      - PolicyName: ParticipantPhotoUploads
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: UploadParticipantPhotos
            Effect: Allow
            Action:
            - s3:PutObject
            Resource:
              Fn::Sub: ${UserMediaBucket.Arn}/players/*
    Metadata:
      SamResourceId: StandPublicRole
  StandAssignRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: stand-${Environment}-assign-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Ref: StandProdGameRolePolicy
      Policies:
      - PolicyName: KivlyRegistration
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            Resource:
              Fn::GetAtt:
              - StandKivlyRegistrationTable
              - Arn
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/kivly/*
      - PolicyName: EmailVerification
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: ConsumeVerification
            Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:ConditionCheckItem
            Resource:
              Fn::GetAtt:
              - StandEmailVerificationTable
              - Arn
    Metadata:
      SamResourceId: StandAssignRole
  StandProdBillingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: stand-${Environment}-billing-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName:
          Fn::Sub: stand-${Environment}-billing-policy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
          - Sid: DynamoDB
            Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:ConditionCheckItem
            Resource:
            - Fn::Sub:
              - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
              - TableName:
                  Ref: StandProdUserTable
          - Sid: SecretsManager
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/stripe*
          - Sid: S3UserMedia
            Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            Resource:
              Fn::Sub: arn:aws:s3:::stand-${Environment}-user-media-${AWS::AccountId}/*
    Metadata:
      SamResourceId: StandProdBillingRole
  StandCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: stand-common
      Description: Shared utilities (log, _resp, _iso_now, etc.) for all Stand Lambda
        functions.
      ContentUri: s3://aws-sam-cli-managed-default-samclisourcebucket-ikdosstmajg3/stand-backend-dev/e5699fa71f18b338d7421a42f296778d
      CompatibleRuntimes:
      - python3.13
      RetentionPolicy: Delete
    Metadata:
      SamResourceId: StandCommonLayer
  StandKivlyRegistrationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: stand-${Environment}-kivly-registration-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
    Metadata:
      SamResourceId: StandKivlyRegistrationTable
  StandEmailVerificationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: stand-${Environment}-email-verification-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
    Metadata:
      SamResourceId: StandEmailVerificationTable
  StandProdUserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: stand-${Environment}-user-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
    Metadata:
      SamResourceId: StandProdUserTable
  StandProdGameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: stand-${Environment}-game-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: gameId
        AttributeType: S
      - AttributeName: ownerUserId
        AttributeType: S
      - AttributeName: gameName
        AttributeType: S
      KeySchema:
      - AttributeName: gameId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: gsi-ownerUserId
        KeySchema:
        - AttributeName: ownerUserId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      - IndexName: gsi-gameName
        KeySchema:
        - AttributeName: gameName
          KeyType: HASH
        Projection:
          ProjectionType: ALL
    Metadata:
      SamResourceId: StandProdGameTable
  StandProdGameplayerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: stand-${Environment}-gameplayer-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: gameId
        AttributeType: S
      - AttributeName: playerId
        AttributeType: N
      - AttributeName: instagramPSID
        AttributeType: S
      - AttributeName: eligibleForGameId
        AttributeType: S
      KeySchema:
      - AttributeName: gameId
        KeyType: HASH
      - AttributeName: playerId
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: gsi-instagramPSID
        KeySchema:
        - AttributeName: instagramPSID
          KeyType: HASH
        - AttributeName: gameId
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: gsi-raffleEligible
        KeySchema:
        - AttributeName: eligibleForGameId
          KeyType: HASH
        - AttributeName: playerId
          KeyType: RANGE
        Projection:
          ProjectionType: KEYS_ONLY
    Metadata:
      SamResourceId: StandProdGameplayerTable
  StandProdCatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: stand-${Environment}-catalog-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: catalogId
        AttributeType: S
      - AttributeName: pairId
        AttributeType: S
      KeySchema:
      - AttributeName: catalogId
        KeyType: HASH
      - AttributeName: pairId
        KeyType: RANGE
    Metadata:
      SamResourceId: StandProdCatalogTable
  StandProdEmpareja2CharBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: stand-${Environment}-empareja2-characters-${AWS::AccountId}
    Metadata:
      SamResourceId: StandProdEmpareja2CharBucket
  InfocardsUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: stand-${Environment}-infocards-uploads-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - PUT
          - GET
          AllowedOrigins:
          - '*'
          MaxAge: 3600
    Metadata:
      SamResourceId: InfocardsUploadsBucket
  UserMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: stand-${Environment}-user-media-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
        - Id: ExpireUncommittedGamePrizeImages
          Status: Enabled
          Prefix: games/staged/
          TagFilters:
          - Key: staged
            Value: 'true'
          ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - PUT
          - POST
          - GET
          - DELETE
          AllowedOrigins:
          - '*'
          MaxAge: 3600
    Metadata:
      SamResourceId: UserMediaBucket
  WebhooksApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name:
        Fn::Sub: stand-${Environment}-webhook-api
      StageName: prod
    Metadata:
      SamResourceId: WebhooksApi
  GameApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name:
        Fn::Sub: stand-${Environment}-game-api
      StageName: prod
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
              audience:
              - Ref: CognitoAppClientId
        DefaultAuthorizer: CognitoAuthorizer
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        AllowHeaders:
        - authorization
        - content-type
    Metadata:
      SamResourceId: GameApi
  StandProdCorsFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: stand-${Environment}-cors-fn
      Description: Handles OPTIONS preflight for GameApi; no JWT so preflight passes.
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-ikdosstmajg3/stand-backend-dev/a7906f9be45c66ea6412a913980bbd3d
      Handler: lambda_function.lambda_handler
      Role:
        Fn::GetAtt:
        - StandProdGameRole
        - Arn
      Events:
        OptionsProxy:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: StandProdCorsFn
  StandProdWebhookFnStripe:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: stand-${Environment}-webhook-fn-stripe
      Description: Processes Stripe webhook events to handle payments, subscriptions,
        and billing state changes.
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-ikdosstmajg3/stand-backend-dev/298effd88a3336198723e4b02c313d67
      Handler: lambda_function.lambda_handler
      Role:
        Fn::GetAtt:
        - StandProdBillingRole
        - Arn
      Layers:
      - Ref: StripeLayerArn
      - Ref: StandCommonLayer
      Events:
        StripePost:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhooksApi
            Path: /webhook/stripe
            Method: POST
    Metadata:
      SamResourceId: StandProdWebhookFnStripe
  StandProdGameFnGame:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: stand-${Environment}-game-fn-game
      Description: Handles game lifecycle (create, list, update and delete games).
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-ikdosstmajg3/stand-backend-dev/c35a4abc6501f8acf59ba64c0f8ecadc
      Handler: lambda_function.lambda_handler
      Role:
        Fn::GetAtt:
        - StandProdGameRole
        - Arn
      Layers:
      - Ref: StandCommonLayer
      Environment:
        Variables:
          USER_MEDIA_BUCKET:
            Ref: UserMediaBucket
          EMAIL_VERIFICATION_TABLE:
            Ref: StandEmailVerificationTable
      Events:
        GameCrudGet:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /v1/game
