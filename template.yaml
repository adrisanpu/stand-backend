AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: STAND Backend - Fully Managed Infrastructure

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - dev
    Description: Deployment environment (prod or dev)
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_54eXBuNq1
    Description: Cognito User Pool ID for JWT authorizer
  CognitoAppClientId:
    Type: String
    Default: 52ekpup21eo5ic4caokn2a33k3
    Description: Cognito App Client ID (JWT audience)
  StripeSuccessUrl:
    Type: String
    Default: https://playstand.app/home
    Description: Stripe checkout success redirect URL
  StripeCancelUrl:
    Type: String
    Default: https://playstand.app/home
    Description: Stripe checkout cancel redirect URL
  StripeLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:781283585341:layer:stripe-layer:5
    Description: ARN of the Stripe Lambda layer (created manually in AWS)

  PlayerTokenSecret:
    Type: String
    MinLength: 32
    NoEcho: true
    Description: Required private HMAC secret (at least 32 characters) for participant sessions

  EmailSenderAddress:
    Type: String
    Default: no-reply@playstand.app
    Description: Verified SES From address for participant email verification

  EmailIdentityName:
    Type: String
    Default: playstand.app
    Description: Existing shared SES domain identity in us-east-1 (managed outside this stack)

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: 128
    Tracing: PassThrough
    Environment:
      Variables:
        STAGE: !Ref Environment
        GAMES_TABLE: !Ref StandProdGameTable
        USERS_TABLE: !Ref StandProdUserTable
        GAMEPLAYER_TABLE: !Ref StandProdGameplayerTable
        CATALOG_TABLE: !Ref StandProdCatalogTable
        STRIPE_SECRET_NAME: !Sub "stand/${Environment}/stripe"
        PLAYER_TOKEN_SECRET: !Ref PlayerTokenSecret


Resources:

# =========================
# IAM ROLE (Lambda execution)
# =========================

  StandProdGameRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stand-${Environment}-game-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref StandProdGameRolePolicy
      Policies:
        - PolicyName: KivlyOwnerCredentials
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/kivly/*"

  StandProdGameRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "stand-${Environment}-game-role-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
          - Sid: DynamoDB
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:TransactWriteItems
              - dynamodb:ConditionCheckItem
            Resource:
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                - TableName: !Ref StandProdGameTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/gsi-ownerUserId"
                - TableName: !Ref StandProdGameTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/gsi-gameName"
                - TableName: !Ref StandProdGameTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                - TableName: !Ref StandProdUserTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                - TableName: !Ref StandProdGameplayerTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/gsi-raffleEligible"
                - TableName: !Ref StandProdGameplayerTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                - TableName: !Ref StandProdCatalogTable
              - !GetAtt StandEmailVerificationTable.Arn
          - Sid: LambdaInvoke
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:stand-${Environment}-*"
          - Sid: S3Presign
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub
              - "arn:aws:s3:::${BucketName}/*"
              - BucketName: !Ref StandProdEmpareja2CharBucket
          - Sid: SSMParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/stand/${Environment}/config/*"
          - Sid: S3ClientLogos
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub "${UserMediaBucket.Arn}/users/*/logos/*"
          - Sid: S3GamePrizeImages
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${UserMediaBucket.Arn}/games/*"
          - Sid: S3ParticipantPhotosRead
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub "${UserMediaBucket.Arn}/players/*"
          - Sid: S3StagedPrizeImageTags
            Effect: Allow
            Action:
              - s3:PutObjectTagging
              - s3:DeleteObjectTagging
            Resource: !Sub "${UserMediaBucket.Arn}/games/staged/*"

  StandPublicRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stand-${Environment}-public-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref StandProdGameRolePolicy
      Policies:
        - PolicyName: EmailVerification
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: VerificationRecords
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt StandEmailVerificationTable.Arn
              - Sid: SendVerificationEmail
                Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub "arn:${AWS::Partition}:ses:us-east-1:${AWS::AccountId}:identity/${EmailIdentityName}"
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref EmailSenderAddress
        - PolicyName: ParticipantPhotoUploads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: UploadParticipantPhotos
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${UserMediaBucket.Arn}/players/*"

  StandAssignRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stand-${Environment}-assign-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref StandProdGameRolePolicy
      Policies:
        - PolicyName: KivlyRegistration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt StandKivlyRegistrationTable.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/kivly/*"
        - PolicyName: EmailVerification
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConsumeVerification
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt StandEmailVerificationTable.Arn

# ----- Billing role (Stripe webhook + checkout + user) -----

  StandProdBillingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stand-${Environment}-billing-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "stand-${Environment}-billing-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !Sub
                    - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                    - TableName: !Ref StandProdUserTable
              - Sid: SecretsManager
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/stripe*"
              - Sid: S3UserMedia
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::stand-${Environment}-user-media-${AWS::AccountId}/*"

# =========================
# LAMBDA LAYERS
# =========================

  StandCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: stand-common
      Description: Shared utilities (log, _resp, _iso_now, etc.) for all Stand Lambda functions.
      ContentUri: layers/stand_common/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete

# =========================
# DYNAMODB TABLES
# =========================

  StandKivlyRegistrationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "stand-${Environment}-kivly-registration-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  StandEmailVerificationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stand-${Environment}-email-verification-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  StandProdUserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stand-${Environment}-user-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  StandProdGameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stand-${Environment}-game-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: gameId
          AttributeType: S
        - AttributeName: ownerUserId
          AttributeType: S
        - AttributeName: gameName
          AttributeType: S
      KeySchema:
        - AttributeName: gameId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi-ownerUserId
          KeySchema:
            - AttributeName: ownerUserId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: gsi-gameName
          KeySchema:
            - AttributeName: gameName
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  StandProdGameplayerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stand-${Environment}-gameplayer-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: gameId
          AttributeType: S
        - AttributeName: playerId
          AttributeType: N
        - AttributeName: instagramPSID
          AttributeType: S
        - AttributeName: eligibleForGameId
          AttributeType: S
      KeySchema:
        - AttributeName: gameId
          KeyType: HASH
        - AttributeName: playerId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi-instagramPSID
          KeySchema:
            - AttributeName: instagramPSID
              KeyType: HASH
            - AttributeName: gameId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi-raffleEligible
          KeySchema:
            - AttributeName: eligibleForGameId
              KeyType: HASH
            - AttributeName: playerId
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY

  StandProdCatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stand-${Environment}-catalog-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: catalogId
          AttributeType: S
        - AttributeName: pairId
          AttributeType: S
      KeySchema:
        - AttributeName: catalogId
          KeyType: HASH
        - AttributeName: pairId
          KeyType: RANGE

# =========================
# S3
# =========================

  StandProdEmpareja2CharBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "stand-${Environment}-empareja2-characters-${AWS::AccountId}"

  InfocardsUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "stand-${Environment}-infocards-uploads-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, GET]
            AllowedOrigins: ["*"]
            MaxAge: 3600

  UserMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "stand-${Environment}-user-media-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUncommittedGamePrizeImages
            Status: Enabled
            Prefix: games/staged/
            TagFilters:
              - Key: staged
                Value: "true"
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, POST, GET, DELETE]
            AllowedOrigins: ["*"]
            MaxAge: 3600

# =========================
# HTTP APIs
# =========================

  WebhooksApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "stand-${Environment}-webhook-api"
      StageName: prod

  GameApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "stand-${Environment}-game-api"
      StageName: prod
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
              audience:
                - !Ref CognitoAppClientId
        DefaultAuthorizer: CognitoAuthorizer
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET","POST","PUT","DELETE","OPTIONS"]
        AllowHeaders: ["authorization","content-type"]

# =========================
# CORS (preflight without auth so browser OPTIONS succeeds)
# =========================

  StandProdCorsFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-cors-fn"
      Description: Handles OPTIONS preflight for GameApi; no JWT so preflight passes.
      CodeUri: src/stand_prod_cors_fn/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Events:
        OptionsProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

# =========================
# WEBHOOK LAMBDAS
# =========================

  StandProdWebhookFnStripe:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-webhook-fn-stripe"
      Description: Processes Stripe webhook events to handle payments, subscriptions, and billing state changes.
      CodeUri: src/stand_prod_webhook_fn_stripe/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdBillingRole.Arn
      Layers:
        - !Ref StripeLayerArn
        - !Ref StandCommonLayer
      Events:
        StripePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhooksApi
            Path: /webhook/stripe
            Method: POST

# =========================
# GAME CORE
# =========================

  StandProdGameFnGame:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-game"
      Description: Handles game lifecycle (create, list, update and delete games).
      CodeUri: src/stand_prod_game_fn_game/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          USER_MEDIA_BUCKET: !Ref UserMediaBucket
          EMAIL_VERIFICATION_TABLE: !Ref StandEmailVerificationTable
      Events:
        GameCrudGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game
            Method: GET
        GameCrudPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game
            Method: POST
        GameCrudPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game
            Method: PUT
        GameCrudDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game
            Method: DELETE
        GamePlayersGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/players
            Method: GET
        GamePlayersDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/players
            Method: DELETE
        GamePrizeUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/prizes
            Method: POST

        KivlyAccountGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/kivly
            Method: GET
        KivlyAccountPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/kivly
            Method: PUT
        KivlyAccountDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/kivly
            Method: DELETE

  StandProdGameFnAssign:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-assign"
      Description: Assigns players to games, enforces plan limits, prevents duplicates, and initializes per-game player state.
      CodeUri: src/stand_prod_game_fn_assign/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandAssignRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          CHAR_BUCKET: !Ref StandProdEmpareja2CharBucket
          EMAIL_VERIFICATION_TABLE: !Ref StandEmailVerificationTable
          KIVLY_REGISTRATION_TABLE: !Ref StandKivlyRegistrationTable
      Events:
        AssignPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/assign
            Method: POST

  StandProdGameValidate:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-validate"
      Description: Validates player participation and game actions based on game rules, feature flags, and completion status.
      CodeUri: src/stand_prod_game_validate/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          CHAR_BUCKET: !Ref StandProdEmpareja2CharBucket
          USER_MEDIA_BUCKET: !Ref UserMediaBucket
      Events:
        ValidatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/validate
            Method: POST

  StandProdGameFnPublic:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-public"
      Description: Public participant APIs (join, validate, display) without Cognito auth.
      CodeUri: src/stand_prod_game_fn_public/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandPublicRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          ASSIGN_LAMBDA: !Ref StandProdGameFnAssign
          VALIDATE_LAMBDA: !Ref StandProdGameValidate
          SCORE_LAMBDA: !Ref StandProdGameScore
          USER_MEDIA_BUCKET: !Ref UserMediaBucket
          CHAR_BUCKET: !Ref StandProdEmpareja2CharBucket
          CHAR_URL_TTL: "120"
          EMAIL_VERIFICATION_TABLE: !Ref StandEmailVerificationTable
          EMAIL_SENDER_ADDRESS: !Ref EmailSenderAddress
          EMAIL_IDENTITY_NAME: !Ref EmailIdentityName
          EMAIL_MAX_PER_HOUR: "5"
          EMAIL_IP_MAX_PER_HOUR: "3000"
          EMAIL_GLOBAL_MAX_PER_HOUR: "20000"
      Events:
        PublicGameGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/game
            Method: GET
            Auth:
              Authorizer: NONE
        PublicEmailRequestPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/email/request
            Method: POST
            Auth:
              Authorizer: NONE
        PublicJoinPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/join
            Method: POST
            Auth:
              Authorizer: NONE
        PublicValidatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/validate
            Method: POST
            Auth:
              Authorizer: NONE
        PublicPlayerGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/player
            Method: GET
            Auth:
              Authorizer: NONE
        PublicPlayerPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/player
            Method: POST
            Auth:
              Authorizer: NONE
        PublicPlayerPhotoPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/player/photo
            Method: POST
            Auth:
              Authorizer: NONE
        PublicRedeemPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/redeem
            Method: POST
            Auth:
              Authorizer: NONE
        PublicScorePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/score
            Method: POST
            Auth:
              Authorizer: NONE
        PublicRulet4SpinPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/rulet4/spin
            Method: POST
            Auth:
              Authorizer: NONE

# =========================
# GAME FEATURES
# =========================

  StandProdGameScore:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-score"
      Description: Stores player scores and provides rankings for games that support scoring.
      CodeUri: src/stand_prod_game_score/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          USER_MEDIA_BUCKET: !Ref UserMediaBucket
      Events:
        ScoreGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/score
            Method: GET
        ScorePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/score
            Method: POST

  StandProdGameFnQuiz:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-quiz"
      Description: Manages quiz configuration, quiz flow, and player quiz responses for games that include quizzes.
      CodeUri: src/stand_prod_game_fn_quiz/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Events:
        QuizGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/quiz
            Method: GET
        QuizPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/quiz
            Method: POST

  StandProdGameFnRaffle:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-raffle"
      Description: Executes game raffles, selects eligible winners, and persists raffle results.
      CodeUri: src/stand_prod_game_fn_raffle/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Events:
        RafflePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/raffle
            Method: POST

  StandProdGameFnImpostor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-impostor"
      Description: Manages impostor game state, rounds, voting, and result resolution.
      CodeUri: src/stand_prod_game_fn_impostor/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          USER_MEDIA_BUCKET: !Ref UserMediaBucket
      Events:
        ImpostorGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/impostor
            Method: GET
        ImpostorPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/impostor
            Method: POST

# =========================
# BILLING
# =========================

  StandProdBillingFnCheckout:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-billing-fn-checkout"
      Description: Creates and manages Stripe checkout sessions for purchasing plans and subscriptions.
      CodeUri: src/stand_prod_billing_fn_checkout/
