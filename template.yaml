AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: STAND Backend - Fully Managed Infrastructure

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - dev
    Description: Deployment environment (prod or dev)
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_54eXBuNq1
    Description: Cognito User Pool ID for JWT authorizer
  CognitoAppClientId:
    Type: String
    Default: 52ekpup21eo5ic4caokn2a33k3
    Description: Cognito App Client ID (JWT audience)
  StripeSuccessUrl:
    Type: String
    Default: https://playstand.app/home
    Description: Stripe checkout success redirect URL
  StripeCancelUrl:
    Type: String
    Default: https://playstand.app/home
    Description: Stripe checkout cancel redirect URL
  StripeLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:781283585341:layer:stripe-layer:5
    Description: ARN of the Stripe Lambda layer (created manually in AWS)

  PlayerTokenSecret:
    Type: String
    Default: stand-dev-player-token-v1
    NoEcho: true
    Description: HMAC secret for participant web session tokens

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: 128
    Tracing: PassThrough
    Environment:
      Variables:
        STAGE: !Ref Environment
        GAMES_TABLE: !Ref StandProdGameTable
        USERS_TABLE: !Ref StandProdUserTable
        GAMEPLAYER_TABLE: !Ref StandProdGameplayerTable
        CATALOG_TABLE: !Ref StandProdCatalogTable
        INSTAGRAM_SECRET_NAME: !Sub "stand/${Environment}/instagram"
        STRIPE_SECRET_NAME: !Sub "stand/${Environment}/stripe"
        PLAYER_TOKEN_SECRET: !Ref PlayerTokenSecret


Resources:

# =========================
# IAM ROLE (Lambda execution)
# =========================

  StandProdGameRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stand-${Environment}-game-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref StandProdGameRolePolicy

  StandProdGameRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "stand-${Environment}-game-role-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
          - Sid: DynamoDB
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
            Resource:
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                - TableName: !Ref StandProdGameTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/gsi-ownerUserId"
                - TableName: !Ref StandProdGameTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/gsi-gameName"
                - TableName: !Ref StandProdGameTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                - TableName: !Ref StandProdUserTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                - TableName: !Ref StandProdGameplayerTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/gsi-instagramPSID"
                - TableName: !Ref StandProdGameplayerTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/gsi-raffleEligible"
                - TableName: !Ref StandProdGameplayerTable
              - !Sub
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                - TableName: !Ref StandProdCatalogTable
          - Sid: SQSQuizQueue
            Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Resource: !GetAtt StandProdQuizQueue.Arn
          - Sid: LambdaInvoke
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:stand-${Environment}-*"
          - Sid: S3Presign
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub
              - "arn:aws:s3:::${BucketName}/*"
              - BucketName: !Ref StandProdEmpareja2CharBucket
          - Sid: SSMParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/stand/${Environment}/config/*"
          # Raffle Lambda needs Instagram PAGE_TOKEN to check is_user_follow_business
          - Sid: InstagramSecretRaffle
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/instagram*"
          # Game functions invoke the sender Lambda for all IG/Stripe calls — no secret access needed here.

# ----- Webhook role (Instagram webhook dispatcher) -----

  StandProdWebhookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stand-${Environment}-webhook-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "stand-${Environment}-webhook-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
              - Sid: LambdaInvoke
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:stand-${Environment}-game-fn-assign"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:stand-${Environment}-game-fn-quiz"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:stand-${Environment}-messaging-fn-instagram-sender"
              - Sid: SecretsManager
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/instagram*"

# ----- Billing role (Stripe webhook + checkout + user) -----

  StandProdBillingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stand-${Environment}-billing-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "stand-${Environment}-billing-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !Sub
                    - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                    - TableName: !Ref StandProdUserTable
              - Sid: SecretsManager
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/stripe*"
              - Sid: S3UserMedia
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::stand-${Environment}-user-media-${AWS::AccountId}/*"

# ----- Sender role (Instagram DM sender — no DB, just calls Graph API) -----

  StandProdSenderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stand-${Environment}-sender-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "stand-${Environment}-sender-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
              - Sid: SecretsManager
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stand/${Environment}/instagram*"

# =========================
# LAMBDA LAYERS
# =========================

  StandCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: stand-common
      Description: Shared utilities (log, _resp, _iso_now, etc.) for all Stand Lambda functions.
      ContentUri: layers/stand_common/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete

# =========================
# DYNAMODB TABLES
# =========================

  StandProdUserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stand-${Environment}-user-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  StandProdGameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stand-${Environment}-game-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: gameId
          AttributeType: S
        - AttributeName: ownerUserId
          AttributeType: S
        - AttributeName: gameName
          AttributeType: S
      KeySchema:
        - AttributeName: gameId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi-ownerUserId
          KeySchema:
            - AttributeName: ownerUserId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: gsi-gameName
          KeySchema:
            - AttributeName: gameName
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  StandProdGameplayerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stand-${Environment}-gameplayer-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: gameId
          AttributeType: S
        - AttributeName: playerId
          AttributeType: N
        - AttributeName: instagramPSID
          AttributeType: S
        - AttributeName: eligibleForGameId
          AttributeType: S
      KeySchema:
        - AttributeName: gameId
          KeyType: HASH
        - AttributeName: playerId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi-instagramPSID
          KeySchema:
            - AttributeName: instagramPSID
              KeyType: HASH
            - AttributeName: gameId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi-raffleEligible
          KeySchema:
            - AttributeName: eligibleForGameId
              KeyType: HASH
            - AttributeName: playerId
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY

  StandProdCatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stand-${Environment}-catalog-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: catalogId
          AttributeType: S
        - AttributeName: pairId
          AttributeType: S
      KeySchema:
        - AttributeName: catalogId
          KeyType: HASH
        - AttributeName: pairId
          KeyType: RANGE

# =========================
# SQS
# =========================

  StandProdQuizDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "stand-${Environment}-quiz-dlq"
      MessageRetentionPeriod: 86400  # 1 day

  StandProdQuizQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "stand-${Environment}-quiz-queue"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StandProdQuizDLQ.Arn
        maxReceiveCount: 3

# =========================
# S3
# =========================

  StandProdEmpareja2CharBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "stand-${Environment}-empareja2-characters-${AWS::AccountId}"

  InfocardsUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "stand-${Environment}-infocards-uploads-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, GET]
            AllowedOrigins: ["*"]
            MaxAge: 3600

  UserMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "stand-${Environment}-user-media-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, GET, DELETE]
            AllowedOrigins: ["*"]
            MaxAge: 3600

# =========================
# HTTP APIs
# =========================

  WebhooksApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "stand-${Environment}-webhook-api"
      StageName: prod

  GameApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "stand-${Environment}-game-api"
      StageName: prod
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
              audience:
                - !Ref CognitoAppClientId
        DefaultAuthorizer: CognitoAuthorizer
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET","POST","PUT","DELETE","OPTIONS"]
        AllowHeaders: ["authorization","content-type"]

# =========================
# CORS (preflight without auth so browser OPTIONS succeeds)
# =========================

  StandProdCorsFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-cors-fn"
      Description: Handles OPTIONS preflight for GameApi; no JWT so preflight passes.
      CodeUri: src/stand_prod_cors_fn/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Events:
        OptionsProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

# =========================
# WEBHOOK LAMBDAS
# =========================

  StandProdWebhookFnInstagram:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-webhook-fn-instagram"
      Description: Receives and dispatches Instagram webhook events to the appropriate internal game and messaging services.
      CodeUri: src/stand_prod_webhook_fn_instagram/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdWebhookRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          ASSIGN_LAMBDA: !Ref StandProdGameFnAssign
          IG_SENDER_LAMBDA: !Ref StandProdMessagingInstagramSender
          QUIZ_LAMBDA: !Ref StandProdGameFnQuiz
      Events:
        InstagramGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhooksApi
            Path: /webhook/instagram
            Method: GET
        InstagramPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhooksApi
            Path: /webhook/instagram
            Method: POST

  StandProdWebhookFnStripe:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-webhook-fn-stripe"
      Description: Processes Stripe webhook events to handle payments, subscriptions, and billing state changes.
      CodeUri: src/stand_prod_webhook_fn_stripe/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdBillingRole.Arn
      Layers:
        - !Ref StripeLayerArn
        - !Ref StandCommonLayer
      Events:
        StripePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhooksApi
            Path: /webhook/stripe
            Method: POST

# =========================
# GAME CORE
# =========================

  StandProdGameFnGame:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-game"
      Description: Handles game lifecycle (create, list, update and delete games).
      CodeUri: src/stand_prod_game_fn_game/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Events:
        GameCrudGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game
            Method: GET
        GameCrudPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game
            Method: POST
        GameCrudPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game
            Method: PUT
        GameCrudDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game
            Method: DELETE

  StandProdGameFnAssign:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-assign"
      Description: Assigns players to games, enforces plan limits, prevents duplicates, and initializes per-game player state.
      CodeUri: src/stand_prod_game_fn_assign/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          IG_SENDER_LAMBDA: !Ref StandProdMessagingInstagramSender
          QUIZ_QUEUE_URL: !Ref StandProdQuizQueue
          CHAR_BUCKET: !Ref StandProdEmpareja2CharBucket
      Events:
        AssignPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/assign
            Method: POST

  StandProdGameValidate:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-validate"
      Description: Validates player participation and game actions based on game rules, feature flags, and completion status.
      CodeUri: src/stand_prod_game_validate/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          IG_SENDER_LAMBDA: !Ref StandProdMessagingInstagramSender
          QUIZ_LAMBDA_NAME: !Ref StandProdGameFnQuiz
          CHAR_BUCKET: !Ref StandProdEmpareja2CharBucket
      Events:
        ValidatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/validate
            Method: POST

  StandProdGameFnPublic:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-public"
      Description: Public participant APIs (join, validate, display) without Cognito auth.
      CodeUri: src/stand_prod_game_fn_public/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          ASSIGN_LAMBDA: !Ref StandProdGameFnAssign
          VALIDATE_LAMBDA: !Ref StandProdGameValidate
          CHAR_BUCKET: !Ref StandProdEmpareja2CharBucket
          CHAR_URL_TTL: "120"
      Events:
        PublicGameGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/game
            Method: GET
            Auth:
              Authorizer: NONE
        PublicJoinPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/join
            Method: POST
            Auth:
              Authorizer: NONE
        PublicValidatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/validate
            Method: POST
            Auth:
              Authorizer: NONE
        PublicPlayerGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/player
            Method: GET
            Auth:
              Authorizer: NONE
        PublicRedeemPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/public/redeem
            Method: POST
            Auth:
              Authorizer: NONE

# =========================
# GAME FEATURES
# =========================

  StandProdGameScore:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-score"
      Description: Stores player scores and provides rankings for games that support scoring.
      CodeUri: src/stand_prod_game_score/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          IG_SENDER_LAMBDA: !Ref StandProdMessagingInstagramSender
      Events:
        ScoreGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/score
            Method: GET
        ScorePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/score
            Method: POST

  StandProdGameFnQuiz:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-quiz"
      Description: Manages quiz configuration, quiz flow, and player quiz responses for games that include quizzes.
      CodeUri: src/stand_prod_game_fn_quiz/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          IG_SENDER_LAMBDA: !Ref StandProdMessagingInstagramSender
      Events:
        QuizGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/quiz
            Method: GET
        QuizPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/quiz
            Method: POST
        QuizSQS:
          Type: SQS
          Properties:
            Queue: !GetAtt StandProdQuizQueue.Arn
            BatchSize: 1

  StandProdGameFnRaffle:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-raffle"
      Description: Executes game raffles, selects eligible winners, persists raffle results, and notifies participants.
      CodeUri: src/stand_prod_game_fn_raffle/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          IG_SENDER_LAMBDA: !Ref StandProdMessagingInstagramSender
          INSTAGRAM_SECRET_NAME: !Sub "stand/${Environment}/instagram"
          IG_GRAPH_VERSION: v24.0
      Events:
        RafflePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/raffle
            Method: POST

  StandProdGameFnImpostor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-game-fn-impostor"
      Description: Manages impostor game state, rounds, voting, and result resolution.
      CodeUri: src/stand_prod_game_fn_impostor/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdGameRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          IG_SENDER_LAMBDA: !Ref StandProdMessagingInstagramSender
      Events:
        ImpostorGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/impostor
            Method: GET
        ImpostorPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/impostor
            Method: POST

# =========================
# BILLING
# =========================

  StandProdBillingFnCheckout:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-billing-fn-checkout"
      Description: Creates and manages Stripe checkout sessions for purchasing plans and subscriptions.
      CodeUri: src/stand_prod_billing_fn_checkout/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdBillingRole.Arn
      Layers:
        - !Ref StripeLayerArn
        - !Ref StandCommonLayer
      Environment:
        Variables:
          STRIPE_SUCCESS_URL: !Ref StripeSuccessUrl
          STRIPE_CANCEL_URL: !Ref StripeCancelUrl
      Events:
        CheckoutPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/billing/checkout
            Method: POST

# =========================
# USER & MESSAGING
# =========================

  StandProdUserFnUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-user-fn-user"
      Description: Manages user accounts, authentication-related data, and user-level configuration and limits.
      CodeUri: src/stand_prod_user_fn_user/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdBillingRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Events:
        UserPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/user
            Method: POST
        MeGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/user/me
            Method: GET

  StandProdUserFnMedia:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-user-fn-media"
      Description: Manages per-user media library (logos and avatar videos) with S3-backed storage.
      CodeUri: src/stand_prod_user_fn_media/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdBillingRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          USER_MEDIA_BUCKET: !Ref UserMediaBucket
          DEFAULT_STAND_LOGO_DARK_KEY: defaults/logo/logo_stand_letters_white.png
          DEFAULT_STAND_LOGO_LIGHT_KEY: defaults/logo/logo_stand_letters_black.png
          DEFAULT_STAND_AVATAR_IDLE_KEY: defaults/avatar/stand-idle.mp4
          DEFAULT_STAND_AVATAR_WIN_KEY: defaults/avatar/stand-win.mp4
          DEFAULT_STAND_AVATAR_LOSE_KEY: defaults/avatar/stand-lose.mp4
      Events:
        UserMediaGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/user/media
            Method: GET
        UserMediaPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/user/media
            Method: POST
        UserMediaPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/user/media
            Method: PUT
        UserMediaDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/user/media
            Method: DELETE

  StandProdMessagingInstagramSender:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-messaging-fn-instagram-sender"
      Description: Sends text messages, quick replies, and media to Instagram users via the Instagram Graph API.
      CodeUri: src/stand_prod_messaging_fn_instagram_sender/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdSenderRole.Arn
      Layers:
        - !Ref StandCommonLayer

# =========================
# INFOCARDS
# =========================

  StandProdInfocardsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stand-${Environment}-infocards-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "stand-${Environment}-infocards-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub
                    - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                    - TableName: !Ref StandProdGameTable
              - Sid: S3InfocardsUploads
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::stand-${Environment}-infocards-uploads-${AWS::AccountId}/*"
              - Sid: S3InfocardsPresign
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::stand-${Environment}-infocards-uploads-${AWS::AccountId}/*"
              - Sid: BedrockInvoke
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-lite-v1:0"
              - Sid: LambdaInvokeQuizGenerate
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:stand-${Environment}-quiz-fn-generate"

  StandProdInfocardsFnGet:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-infocards-fn-get"
      Description: Returns info cards for an INFOCARDS game (GET) and persists updated cards with media keys (PUT).
      CodeUri: src/stand_prod_infocards_fn_get/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdInfocardsRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Environment:
        Variables:
          INFOCARDS_BUCKET: !Ref InfocardsUploadsBucket
      Events:
        InfocardsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/infocards
            Method: GET
        InfocardsPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/infocards
            Method: PUT

  StandProdInfocardsFnUploadUrl:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-infocards-fn-upload-url"
      Description: Generates S3 presigned PUT URLs for infocards content uploads.
      CodeUri: src/stand_prod_infocards_fn_upload_url/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdInfocardsRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Timeout: 15
      Environment:
        Variables:
          INFOCARDS_BUCKET: !Ref InfocardsUploadsBucket
      Events:
        InfocardsUploadUrlPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/infocards/upload-url
            Method: POST

  StandProdInfocardsFnProcess:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-infocards-fn-process"
      Description: Processes uploaded content with Bedrock AI to generate info cards (and optionally a quiz).
      CodeUri: src/stand_prod_infocards_fn_process/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdInfocardsRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          INFOCARDS_BUCKET: !Ref InfocardsUploadsBucket
          BEDROCK_REGION: us-east-1
          BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
          QUIZ_GENERATE_FUNCTION_NAME: !Sub "stand-${Environment}-quiz-fn-generate"
      Events:
        InfocardsProcessPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/infocards/process
            Method: POST

  StandProdQuizFnGenerate:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stand-${Environment}-quiz-fn-generate"
      Description: Generates quiz questions from a text prompt using Bedrock AI and saves them.
      CodeUri: src/stand_prod_quiz_fn_generate/
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StandProdInfocardsRole.Arn
      Layers:
        - !Ref StandCommonLayer
      Timeout: 60
      Environment:
        Variables:
          BEDROCK_REGION: us-east-1
          BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
      Events:
        QuizGeneratePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /v1/game/quiz/generate
            Method: POST

# =========================
# OUTPUTS
# =========================

Outputs:
  Environment:
    Value: !Ref Environment
  WebhooksApiUrl:
    Value: !Sub "https://${WebhooksApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  GameApiUrl:
    Value: !Sub "https://${GameApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

